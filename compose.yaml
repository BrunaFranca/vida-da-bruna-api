# Ambiente local completo: `docker compose up --build -d`
#   API ........ http://localhost:8080/readyz
#   Grafana .... http://localhost:3000  (entra direto, sem login, só local)
# Carga + incidente simulado: ver docs/runbooks/banco-fora.md
# Todas as portas presas em 127.0.0.1: nada fica exposto na rede.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: vida
      POSTGRES_PASSWORD: vida-local # só para desenvolvimento local
      POSTGRES_DB: vida
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vida -d vida"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgres://vida:vida-local@db:5432/vida?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      OTEL_METRIC_EXPORT_INTERVAL: "10000" # métricas a cada 10 s
      VERSAO: local
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      collector:
        condition: service_started

  # ---------- observabilidade (LGTM: Loki, Grafana, Tempo, Mimir) ----------
  collector:
    image: otel/opentelemetry-collector-contrib:0.129.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observabilidade/collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [mimir, tempo, loki]

  mimir:
    image: grafana/mimir:2.16.0
    command: ["-config.file=/etc/mimir/mimir.yaml"]
    volumes:
      - ./observabilidade/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - ./observabilidade/mimir/alertmanager.yaml:/etc/mimir/alertmanager.yaml:ro
      - ./observabilidade/mimir/regras:/etc/mimir/regras:ro
      - mimir:/data
    ports:
      - "127.0.0.1:9009:9009"

  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: root # volume local; simplifica permissões no Docker Desktop
    volumes:
      - ./observabilidade/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  loki:
    image: grafana/loki:3.5.1
    command: ["-config.file=/etc/loki/loki.yaml"]
    user: root
    volumes:
      - ./observabilidade/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki:/loki
    ports:
      - "127.0.0.1:3100:3100"

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # só local
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [mimir, tempo, loki]

  # Gerador de carga (só sobe quando pedido): docker compose --profile carga run --rm k6
  k6:
    image: grafana/k6:1.1.0
    profiles: [carga]
    command: ["run", "/carga/trafego.js"]
    environment:
      ALVO: http://api:8080
    volumes:
      - ./carga:/carga:ro
    depends_on: [api]

volumes:
  dados:
  mimir:
  tempo:
  loki:
