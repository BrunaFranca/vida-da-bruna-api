name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Postgres de verdade para os testes de integração (internal/docs).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vida
          POSTGRES_PASSWORD: vida-ci
          POSTGRES_DB: vida
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vida -d vida"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://vida:vida-ci@localhost:5432/vida?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t vida-da-bruna-api:ci .

  # Configuração de observabilidade é código: nada quebrado entra no repo.
  observabilidade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Regras de SLO (promtool)
        run: docker run --rm -v "$PWD/observabilidade/mimir/regras:/r:ro" --entrypoint promtool prom/prometheus:v3.4.2 check rules /r/anonymous/slo.yaml
      - name: Config do Collector
        run: docker run --rm -v "$PWD/observabilidade/collector:/c:ro" otel/opentelemetry-collector-contrib:0.129.1 validate --config=/c/config.yaml
      - name: Dashboards são JSON válido
        run: for f in observabilidade/grafana/dashboards/*.json; do jq empty "$f" && echo "ok $f"; done
      - name: Compose válido
        run: docker compose config --quiet

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/chart
      - name: Manifestos válidos (kubeconform)
        run: |
          helm template api deploy/chart -n vida > /tmp/api.yaml
          docker run --rm -v /tmp:/t ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary /t/api.yaml
      - run: bash -n deploy/*.sh
