name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Postgres de verdade para os testes de integração (internal/docs).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vida
          POSTGRES_PASSWORD: vida-ci
          POSTGRES_DB: vida
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vida -d vida"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://vida:vida-ci@localhost:5432/vida?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t vida-da-bruna-api:ci .
